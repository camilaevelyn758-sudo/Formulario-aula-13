<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title> Formulário </title>
</head>
<body>

    <div class="cabecalho">
        <h1> Formulário </h1>
        <h2> Preencha os campos abaixo </h2>
    </div>

    <div class="formulario"> 

    
<form action="" method="POST"> <!--POST/GET-->

    <div class="campo">
        <label for="nome"> Nome Completo </label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo do usuário" 
       size="40"  required> 
    </div>



    <div class="campo">
        <label for="cidade"> Cidade </label>
        <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade onde reside o usuário" 
       size="40" >
    </div>

    <div class="campo">
        <label for="email"> E-mail </label>
        <input type="email" id="email" name="email" placeholder="Digite o email do usuário" 
       size="40" >
    </div>

    
    <div class="campo">
        <label for="senha"> Senha de Acesso </label>
        <input type="password" id="senha" name="senha" placeholder="Digite a senha do usuário" 
       size="40" >
    </div>

    <div class="campo">
        <label for="data"> Data de Nascimento </label>
        <input type="date" id="data" name="data" placeholder="Digite a data de nascimento do usuário" 
       size="10" required>
    </div>

    <div class="campo">
        <label for="telefone"> Telefone de Contato </label>
        <input type="tel" id="telefone" name="telefone" placeholder="(###) #####-####" 
       size="10" required>
    </div>

    <div class="campo">
        <label for="estado"> Estado </label>
        <select name="estado" id="estado" required>
            <option> Rio de Janeiro</option>
            <option> São Paulo </option> 
            <option> Minas Gerais </option>
            <option> Ceará </option>
        </select>
           
    </div>

    <div class="campo" >  
        
    <label class="titulo-campo"> Turno de preferência </label>
    <label class="opcao"> 
        <input type="radio" name="turno" value="manha" required> Manhã 
    </label>
    
    <label class="opcao">
        <input type="radio" name="turno" value="tarde"> Tarde 
    </label>

    <label class="opcao">
        <input type="radio" name="turno" value="noite"> Noite 
    </label>
</div>
   


    <div class="campo" > 

        <label class="titulo-campo"> Áreas de interesse </label>
    <label class="opcao"> 
        <input type="checkbox" name="interesses" value="tecnologia"> Tecnologia 
    </label>
    
    <label class="opcao">
        <input type="checkbox" name="interesses" value="design"> Design 
    </label>

    <label class="opcao">
        <input type="checkbox" name="interesses" value="marketing"> Marketing 
    </label>
</div>


    <div class="campo">
        <label for="obs">Observações</label>
        <textarea id="obs" name="obs" rows="3" size="60" 
        placeholder="Escreva aqui seu comentário..." cols="50"></textarea>
</div>

 <div class="campo"
 <label for="imagem"> Escolha a foto do usuario</label>
 <input type="file" name="imagem" placeholder="Selecione uma imagem" accept="image/png , image/jpeg" id="imagem" required>


  <div class="botao">
     <button class="button" type="submit"> Enviar </button>
</div>

</form>
</div>

    
    
</body>
</html>
